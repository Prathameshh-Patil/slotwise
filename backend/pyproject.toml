[project]
name = "slotwise-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.15",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "pyjwt>=2.15",
    "bcrypt>=5.0",
    "email-validator>=2.3",
    "python-multipart>=0.0.32",  # FastAPI needs it to read the login form
    "celery[redis]>=5.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",  # used by FastAPI's TestClient
    "ruff>=0.16",
]

# The backend is an app, not a library, so there is no package to build.
# pyproject.toml is only used to list dependencies and configure tools.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes and pycodestyle errors, I: import sorting, B: likely bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]
